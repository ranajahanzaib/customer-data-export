services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer_export
      POSTGRES_USER: export
      POSTGRES_PASSWORD: export_dev_only
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U export -d customer_export"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: localminio_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://127.0.0.1:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  minio-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on:
      minio: { condition: service_healthy }
    volumes: ["./fixtures:/seed:ro"]
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://minio:9000 localminio localminio_secret && mc mb --ignore-existing local/attachments && mc mb --ignore-existing local/exports && mc cp /seed/acme-brief.txt local/attachments/10000000-0000-4000-8000-000000000001/acme-brief.txt && mc cp /seed/acme-brief.txt local/attachments/10000000-0000-4000-8000-000000000002/northstar-brief.txt && mc cp /seed/acme-brief.txt local/attachments/10000000-0000-4000-8000-000000000003/juniper-brief.txt",
      ]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://export:export_dev_only@postgres:5432/customer_export?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      HTTP_ADDR: :8080
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    build: .
    entrypoint: ["/usr/local/bin/worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://export:export_dev_only@postgres:5432/customer_export?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      WORKER_ID: compose-worker
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
volumes:
  pgdata:
  miniodata:
